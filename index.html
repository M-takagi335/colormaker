<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>絵の具混色ゲーム</title>
<link rel="stylesheet" href="./css/style.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>絵の具混色ゲーム</h1></div><nav aria-label="メニュー"><button id="records">記録</button><button id="settings">設定</button></nav></header>
<main>
  <section class="studio" aria-label="混色アトリエ">
    <aside class="reference">
      <div class="ref-heading"><h2>色見本</h2><span id="round"></span></div>
      <div class="swatches">
        <div><div class="swatch" id="target"></div><span>見本の色</span></div>
        <div><div class="swatch empty" id="current"></div><span>作っている色</span></div>
      </div>
      <div class="uniform"><span id="uniform-label">絵の具を出すと比較できます</span><progress id="uniform" max="100" value="0" aria-label="混色の均一度"></progress></div>
      <button class="quiet skip" id="skip">お題をスキップ <span aria-hidden="true">→</span></button>
    </aside>
    <section class="workbench" aria-label="パレットと絵の具">
      <div class="board">
        <div class="tray">
          <canvas id="palette" width="144" height="88" aria-label="混色パレット"></canvas>
          <div id="empty-note" class="empty-note"><span class="brush-mark" aria-hidden="true">✦</span><strong>まずは絵の具をひとしぼり</strong><small>チューブを押し、パレットをなぞって混ぜます</small></div>
        </div>
        <div class="paint-rack"><div id="tubes" class="tubes" aria-label="絵の具のチューブ"></div></div>
      </div>
      <div class="actions"><button id="undo"><span aria-hidden="true">↶</span> 元に戻す</button><button id="reset">リセット</button><button class="primary" id="finish">完成 <span aria-hidden="true">→</span></button></div>
      <p class="tip">短押しで少しずつ、長押しでたっぷり。</p>
    </section>
  </section>
  <p id="save-status" role="status"></p>
</main>
<dialog id="result"><div class="dialog-top"><h2>採点結果</h2><form method="dialog"><button aria-label="閉じる">×</button></form></div><div id="result-body"></div><div class="dialog-actions"><button id="continue">混色を続ける</button><button id="retry">同じお題でやり直す</button><button id="next" class="primary">次のお題へ →</button></div></dialog>
<dialog id="settings-dialog"><div class="dialog-top"><h2>音の設定</h2><form method="dialog"><button aria-label="閉じる">×</button></form></div><label class="setting">効果音の音量 <input id="volume" type="range" min="0" max="100"></label><label class="setting"><input id="mute" type="checkbox"> ミュート</label></dialog>
<dialog id="records-dialog"><div class="dialog-top"><h2>混色の記録</h2><form method="dialog"><button aria-label="閉じる">×</button></form></div><div id="records-body"></div></dialog>
</body>
</html>
